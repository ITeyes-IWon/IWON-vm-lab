- name: Deploy integration artifact with java_service role
  ansible.builtin.include_role:
    name: java_service
  vars:
    java_service_name: integration
    java_service_description: IWON Integration Service
    java_app_dir: /opt/apps/integration
    java_jar_local_src: "{{ target_artifact }}"
    java_jar_remote_name: IWonPaymentIntegration-0.0.1-SNAPSHOT.jar
    java_log_file: "{{ log_dir }}/integration.log"
    java_env_vars:
      KAFKA_BOOTSTRAP_SERVERS: "{{ kafka_client_bootstrap_servers }}"
      KAFKA_SECURITY_PROTOCOL: "{{ kafka_client_security_protocol }}"
      KAFKA_TLS_ENABLED: "{{ kafka_client_tls_enabled }}"
      KAFKA_SASL_ENABLED: "{{ kafka_client_sasl_enabled }}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "{{ kafka_client_bootstrap_servers }}"
      SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "{{ kafka_client_security_protocol }}"
      SPRING_DATASOURCE_URL: "{{ spring_datasource_url }}"
      SPRING_DATASOURCE_USERNAME: "{{ spring_datasource_username }}"
      SPRING_DATASOURCE_PASSWORD: "{{ spring_datasource_password }}"
      IWON_API_AUTH_ENABLED: "{{ iwon_api_auth_enabled }}"
      IWON_API_KEY_HEADER: "{{ iwon_api_key_header }}"
      IWON_WALLET_AES_KEY_BASE64: "{{ iwon_wallet_aes_key_base64 }}"
      IWON_RPC_URL: "{{ iwon_rpc_url }}"
      IWON_TOKEN_ADDRESS: "{{ iwon_token_address }}"
      IWON_CHAIN_ID: "{{ iwon_chain_id }}"
      IWON_TOKEN_DECIMALS: "{{ iwon_token_decimals }}"
      IWON_COMPANY_PRIVATE_KEY: "{{ iwon_company_private_key }}"
      IWON_COMPANY_WALLET_USER_ID: "{{ iwon_company_wallet_user_id }}"
      IWON_ADMIN_PRIVATE_KEY: "{{ iwon_admin_private_key }}"
