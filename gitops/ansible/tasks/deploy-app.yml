- name: Deploy APP artifact with java_service role
  ansible.builtin.include_role:
    name: java_service
  vars:
    java_service_name: app
    java_service_description: IWON App Service
    java_app_dir: /opt/apps/app
    java_jar_local_src: "{{ target_artifact }}"
    java_jar_remote_name: app.jar
    java_log_file: "{{ log_dir }}/app.log"
    java_env_vars:
      APP_UPLOAD_DIR: "{{ lookup('ansible.builtin.env', 'KV_APP_UPLOAD_DIR') }}"
      APP_CRYPTO_SECRET: "{{ lookup('ansible.builtin.env', 'KV_APP_CRYPTO_SECRET') }}"
      APP_HMAC_SECRET: "{{ lookup('ansible.builtin.env', 'KV_APP_HMAC_SECRET') }}"
      APP_SERVLET_CONTEXT_PATH: "{{ lookup('ansible.builtin.env', 'KV_APP_SERVLET_CONTEXT_PATH') }}"
      WEB_SERVLET_CONTEXT_PATH: "{{ lookup('ansible.builtin.env', 'KV_WEB_SERVLET_CONTEXT_PATH') }}"
      SERVER_SERVLET_CONTEXT_PATH: "{{ lookup('ansible.builtin.env', 'KV_APP_SERVLET_CONTEXT_PATH') | default(lookup('ansible.builtin.env', 'KV_SERVER_SERVLET_CONTEXT_PATH'), true) }}"
      SPRING_DATASOURCE_URL: "{{ spring_datasource_url }}"
      SPRING_DATASOURCE_USERNAME: "{{ spring_datasource_username }}"
      SPRING_DATASOURCE_PASSWORD: "{{ spring_datasource_password }}"
      IWON_WALLET_API_BASE_URL: "{{ iwon_wallet_api_base_url }}"
      TOKEN_API_BASE_PATH: "{{ token_api_base_path }}"

